[project]
name = "toolnest"
version = "0.1.0"
description = "ToolNest — Free Online Tools Website"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pikepdf>=10.17.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "qrcode[pil]>=8.2",
    "slowapi>=0.1.10",
    "sqladmin>=0.32.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

